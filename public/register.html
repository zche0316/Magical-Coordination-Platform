<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <style>
    body { font-family: 'Georgia', serif; background-color: #f2f0e6; color: #2f2f2f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .register-container { background-color: #fff9ec; border: 1px solid #d6c7a1; border-radius: 8px; padding: 40px 30px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); width: 360px; text-align: center; }
    .register-container h2 { margin-top: 0; color: #5b3e1d; font-size: 1.8em; }
    .register-container label { display: block; text-align: left; margin: 15px 0 5px; font-size: 0.95em; color: #3c2a13; }
    .register-container input, .register-container select { width: 100%; padding: 8px 10px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background-color: #5b3e1d; color: white; padding: 10px 0; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; width: 100%; margin-top: 20px; transition: background-color 0.2s; }
    .btn:hover { background-color: #7a4e20; }
    .link { display: block; margin-top: 15px; font-size: 0.85em; color: #6c757d; text-decoration: none; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>✨ Wizard Register</h2>
    <form action="/register" method="POST">
      <label for="role">Choose Role</label>
      <select name="role" id="role" required>
        <option value="">-- Select your role --</option>
        <option value="Senior Wizard">Senior Wizard</option>
        <option value="Junior Wizard">Junior Wizard</option>
        <option value="Inventory Manager">Inventory Manager</option>
        <option value="Magical Analyst">Magical Analyst</option>
      </select>
      <label for="username">Username</label>
      <input name="username" id="username" type="text" placeholder="Create a username" required />
      <label for="password">Password</label>
      <input name="password" id="password" type="password" placeholder="Create a password" required />
      <button type="submit" class="btn">Register</button>
    </form>
    <a href="index.html" class="link">Back to Login</a>
  </div>
</body>
</html>
