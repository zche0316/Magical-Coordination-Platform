<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magical Coordination Platform - Login</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f2f0e6;
      color: #2f2f2f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: #fff9ec;
      border: 1px solid #d6c7a1;
      border-radius: 8px;
      padding: 40px 30px;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.1);
      width: 320px;
      text-align: center;
    }
    .login-container h2 {
      margin-top: 0;
      color: #5b3e1d;
      font-size: 1.8em;
    }
    .login-container label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 0.95em;
      color: #3c2a13;
    }
    .login-container input,
    .login-container select {
      width: 100%;
      padding: 8px 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .btn {
      background-color: #5b3e1d;
      color: white;
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #7a4e20;
    }
    .link {
      display: block;
      margin-top: 15px;
      font-size: 0.85em;
      color: #6c757d;
      text-decoration: none;
    }
    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>🧙 Magical Coordination Platform</h2>
    <form id="loginForm" action="/login" method="POST">
      <label for="role">Select User Type</label>
      <select name="role" id="role" required>
        <option value="">-- Choose your role --</option>
        <option value="Senior Wizard">Senior Wizard</option>
        <option value="Junior Wizard">Junior Wizard</option>
        <option value="Inventory Manager">Inventory Manager</option>
        <option value="Magical Analyst">Magical Analyst</option>
      </select>
      <label for="username">Username</label>
      <input name="username" id="username" type="text" placeholder="Enter your username" required />
      <label for="password">Password</label>
      <input name="password" id="password" type="password" placeholder="Enter your password" required />
      <button type="submit" class="btn">Login</button>
    </form>
    <div id="loginError" style="color:#dc3545;margin-top:10px;"></div>
    <a href="register.html" class="link">Register if you don't have an account.</a>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value,
        role: form.role.value
      };
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const text = await res.text();
      if (res.redirected) {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('role', data.role);
        window.location.href = res.url;
      } else if (text.includes('dashboard') || text.includes('not implemented')) {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('role', data.role);
        const match = text.match(/href=["']([^"']+dashboard\.html)["']/);
        if (match) {
          window.location.href = match[1];
        } else {
          document.getElementById('loginError').textContent = text;
        }
      } else {
        document.getElementById('loginError').textContent = text;
      }
    });
  </script>
</body>
</html>
